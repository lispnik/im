name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Trigger when tecgraf-im builds complete
  repository_dispatch:
    types: [tecgraf-im-build-complete]

jobs:
  test:
    strategy:
      # Without this, one platform failing cancels the others and hides
      # whether the failure is platform-specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            im-workflow: ci-linux.yml
            im-libs-artifact: im-libs-ubuntu-24.04
            im-headers-artifact: im-headers-ubuntu-24.04
            im-check-name: Build IM (Ubuntu 24.04)
          - os: macos-latest
            platform: macos
            im-workflow: ci-macos.yml
            im-libs-artifact: im-libs-macos-15
            im-headers-artifact: im-headers-macos-15
            im-check-name: Build IM (macos-15)
          - os: windows-latest
            platform: windows
            im-workflow: ci-windows.yml
            im-libs-artifact: im-libs-windows-2022
            im-headers-artifact: im-headers-windows-2022
            im-check-name: Build IM (windows-2022)

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        # Git Bash on the Windows runner, so one set of shell steps works
        # on all three platforms.
        shell: bash

    steps:
    - uses: actions/checkout@v4

    - name: Install SBCL (Linux)
      if: matrix.platform == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y sbcl

    - name: Install SBCL (macOS)
      if: matrix.platform == 'macos'
      run: brew install sbcl

    - name: Install SBCL (Windows)
      if: matrix.platform == 'windows'
      run: |
        choco install sbcl --no-progress -y
        cygpath -w "/c/Program Files/Steel Bank Common Lisp" >> "$GITHUB_PATH"

    - name: Install system dependencies (Linux)
      if: matrix.platform == 'linux'
      run: |
        sudo apt-get install -y \
          libx11-6 \
          libxext6 \
          libxrender1 \
          libxft2 \
          libcairo2 \
          libpango-1.0-0 \
          libfreetype6 \
          libgl1 \
          libglu1-mesa \
          liblua5.4-0 \
          lua5.4 \
          libtiff6 \
          libpng16-16 \
          libjpeg8 \
          zlib1g \
          libexif12 \
          liblzf1 \
          liblz4-1 \
          libfftw3-double3 \
          libgomp1

    - name: Install system dependencies (macOS)
      if: matrix.platform == 'macos'
      run: |
        brew install \
          cairo \
          pango \
          freetype \
          lua \
          libtiff \
          libpng \
          jpeg \
          libexif \
          jasper \
          fftw

    # tecgraf-base is a sibling project rather than a registry system, so
    # it is not in ocicl.csv and ocicl cannot fetch it. Clone it and put
    # it on the source registry alongside this checkout.
    - name: Check out tecgraf-base
      run: git clone --depth 1 https://github.com/lispnik/tecgraf-base.git "$HOME/tecgraf-base"

    - name: Install and configure ocicl
      run: |
        # Clone the ocicl *tool* outside the repo so it does not collide
        # with this project's gitignored ocicl/ dependency directory.
        git clone --depth 1 https://github.com/ocicl/ocicl.git "$HOME/ocicl-src"
        ( cd "$HOME/ocicl-src" && sbcl --non-interactive --load setup.lisp )

        # setup.lisp installs the binary and the runtime to different
        # places on Windows than on Unix, so locate them rather than
        # assume either layout.
        bin="$(find "$HOME" -type f \( -name ocicl -o -name ocicl.exe \) 2>/dev/null \
                 | grep -v '/ocicl-src/' | head -1)"
        runtime="$(find "$HOME" -type f -name ocicl-runtime.lisp 2>/dev/null \
                     | grep -v '/ocicl-src/' | head -1)"
        test -n "$bin"     || { echo "ocicl binary not found after setup"; exit 1; }
        test -n "$runtime" || { echo "ocicl runtime not found after setup"; exit 1; }
        echo "ocicl binary:  $bin"
        echo "ocicl runtime: $runtime"

        dirname "$bin" >> "$GITHUB_PATH"
        if [ "$RUNNER_OS" = Windows ]; then
          runtime="$(cygpath -m "$runtime")"
        fi
        echo "OCICL_RUNTIME=$runtime" >> "$GITHUB_ENV"

    - name: Restore dependencies
      run: |
        ocicl setup
        # Installs the versions pinned in the checked-in ocicl.csv.
        ocicl install

    - name: Wait for tecgraf-im build completion
      uses: fountainhead/action-wait-for-check@v1.1.0
      id: wait-for-im-build
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        # Must match the upstream job name exactly. The jobs there are
        # named "Build IM (<runner>)", where <runner> is the image the
        # artifact was built on - not this workflow's runner label.
        checkName: ${{ matrix.im-check-name }}
        ref: master
        # This action takes owner and repo separately; a combined
        # "lispnik/tecgraf-im" here is resolved as
        # lispnik/lispnik/tecgraf-im and 404s.
        owner: lispnik
        repo: tecgraf-im
        timeoutSeconds: 1800
        intervalSeconds: 30

    - name: Download IM library artifacts
      if: steps.wait-for-im-build.outputs.conclusion == 'success'
      uses: dawidd6/action-download-artifact@v2
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        workflow: ${{ matrix.im-workflow }}
        repo: lispnik/tecgraf-im
        branch: master
        name: ${{ matrix.im-libs-artifact }}
        path: im-libs/

    - name: Download IM header artifacts
      if: steps.wait-for-im-build.outputs.conclusion == 'success'
      uses: dawidd6/action-download-artifact@v2
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        workflow: ${{ matrix.im-workflow }}
        repo: lispnik/tecgraf-im
        branch: master
        name: ${{ matrix.im-headers-artifact }}
        path: im-headers/

    # There is no Windows counterpart to the dependency installs above:
    # upstream builds Windows against vcpkg x64-windows, whose DLLs
    # (tiff.dll, jpeg62.dll, ...) do not match what choco or MSYS2 would
    # install, so the im-libs artifact has to carry them. The listing at
    # the end of this step is what shows whether it does.
    - name: Set up library and source paths
      run: |
        if [ ! -d im-libs ]; then
          echo "::error::IM libraries unavailable. The upstream check '${{ matrix.im-check-name }}' on lispnik/tecgraf-im@master concluded '${{ steps.wait-for-im-build.outputs.conclusion }}', so no artifact was downloaded. Nothing can be tested on this platform until that build is fixed."
          exit 1
        fi

        case "$RUNNER_OS" in
          Linux)
            echo "LD_LIBRARY_PATH=$PWD/im-libs:$LD_LIBRARY_PATH" >> "$GITHUB_ENV" ;;
          macOS)
            echo "DYLD_LIBRARY_PATH=$PWD/im-libs:$DYLD_LIBRARY_PATH" >> "$GITHUB_ENV" ;;
          Windows)
            # Windows resolves dependent DLLs through PATH, and the IM
            # DLLs load each other, so the directory has to be on it.
            cygpath -w "$PWD/im-libs" >> "$GITHUB_PATH" ;;
        esac

        # SBCL on Windows is a native binary, so it cannot use the
        # /d/a/... MSYS paths Git Bash reports. cygpath -m gives a Windows
        # path with forward slashes, which SBCL accepts and which needs no
        # backslash escaping inside a Lisp string.
        libs="$PWD/im-libs"
        workspace="$PWD"
        tecgraf="$HOME/tecgraf-base"
        if [ "$RUNNER_OS" = Windows ]; then
          libs="$(cygpath -m "$libs")"
          workspace="$(cygpath -m "$workspace")"
          tecgraf="$(cygpath -m "$tecgraf")"
        fi
        echo "IM_LIBS_DIR=$libs" >> "$GITHUB_ENV"
        echo "LISP_WORKSPACE=$workspace" >> "$GITHUB_ENV"
        echo "TECGRAF_BASE_DIR=$tecgraf" >> "$GITHUB_ENV"

        ls -la im-libs/

    - name: Test library loading
      run: |
        # cffi is loaded before the form that pushes onto
        # cffi:*foreign-library-directories*, because each --eval is read
        # only after the previous one has been evaluated - the package has
        # to exist before that symbol can be read.
        sbcl --non-interactive \
          --eval "(unless (member :ocicl *features*) (load \"$OCICL_RUNTIME\"))" \
          --eval "(asdf:initialize-source-registry '(:source-registry (:directory \"$LISP_WORKSPACE\") (:directory \"$TECGRAF_BASE_DIR\") :inherit-configuration))" \
          --eval '(asdf:load-system :cffi)' \
          --eval "(push \"$IM_LIBS_DIR/\" cffi:*foreign-library-directories*)" \
          --eval '(asdf:load-system :im-cffi)' \
          --eval '(format t "~%IM library loaded successfully~%")'

    - name: Report IM version and formats
      run: |
        sbcl --non-interactive \
          --eval "(unless (member :ocicl *features*) (load \"$OCICL_RUNTIME\"))" \
          --eval "(asdf:initialize-source-registry '(:source-registry (:directory \"$LISP_WORKSPACE\") (:directory \"$TECGRAF_BASE_DIR\") :inherit-configuration))" \
          --eval '(asdf:load-system :cffi)' \
          --eval "(push \"$IM_LIBS_DIR/\" cffi:*foreign-library-directories*)" \
          --eval '(asdf:load-system :im)' \
          --eval '(progn
                    (format t "~%Version: ~A~%" (im:version))
                    (format t "Available formats: ~A~%" (im:format-list)))'

    - name: Run the test suite
      run: |
        # :im-tests, not :im - im.asd defines no test-op, so testing :im
        # would silently run nothing.
        sbcl --non-interactive \
          --eval "(unless (member :ocicl *features*) (load \"$OCICL_RUNTIME\"))" \
          --eval "(asdf:initialize-source-registry '(:source-registry (:directory \"$LISP_WORKSPACE\") (:directory \"$TECGRAF_BASE_DIR\") :inherit-configuration))" \
          --eval '(asdf:load-system :cffi)' \
          --eval "(push \"$IM_LIBS_DIR/\" cffi:*foreign-library-directories*)" \
          --eval '(asdf:test-system :im-tests)'

    - name: Load im-process
      run: |
        sbcl --non-interactive \
          --eval "(unless (member :ocicl *features*) (load \"$OCICL_RUNTIME\"))" \
          --eval "(asdf:initialize-source-registry '(:source-registry (:directory \"$LISP_WORKSPACE\") (:directory \"$TECGRAF_BASE_DIR\") :inherit-configuration))" \
          --eval '(asdf:load-system :cffi)' \
          --eval "(push \"$IM_LIBS_DIR/\" cffi:*foreign-library-directories*)" \
          --eval '(asdf:load-system :im-process)' \
          --eval '(format t "~%IM process library loaded successfully~%")'

