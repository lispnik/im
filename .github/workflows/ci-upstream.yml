name: CI (upstream HEAD)

# Test against tecgraf-im's *unreleased* tip, so an upstream regression is
# found before it reaches a release rather than after.
#
# The counterpart is ci.yml, which builds against the pinned release. The two
# fail for different reasons, which is the point of separating them:
#
#   ci.yml red          the binding is broken against what users install
#   ci-upstream.yml red upstream master broke us, and has not shipped yet
#
# Sent by lispnik/tecgraf-im's notify-downstream workflow once a commit has
# built successfully on every platform. The payload carries that commit and
# the run id per platform, so every platform's libraries come from one commit
# rather than from whatever happened to be newest.
on:
  repository_dispatch:
    types: [tecgraf-im-build-complete]
  # Runnable by hand as well, to re-test upstream without waiting for a commit
  # there. The two paths fetch differently and are NOT equivalent -- see the
  # download steps below.
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch of lispnik/tecgraf-im to take libraries from"
        required: false
        default: master

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing must not hide the others; whether a failure is
      # platform-specific is usually the first thing worth knowing.
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            os: ubuntu-24.04
            im-artifact: im-libs-ubuntu-24.04
            im-workflow: ci-linux.yml
            run-id-key: linux_run_id
          # Free on public repositories, and the only source of aarch64 Linux
          # libraries -- upstream's Linux CI was x86_64 only until recently.
          - name: Linux arm64
            os: ubuntu-24.04-arm
            im-artifact: im-libs-ubuntu-24.04-arm
            im-workflow: ci-linux.yml
            run-id-key: linux_run_id
          - name: macOS arm64
            os: macos-15
            im-artifact: im-libs-macos-15
            im-workflow: ci-macos.yml
            run-id-key: macos_run_id
          - name: Windows x64
            os: windows-2022
            im-artifact: im-libs-windows-2022
            im-workflow: ci-windows.yml
            run-id-key: windows_run_id

    defaults:
      run:
        # Git Bash on the Windows runner, so one set of shell steps works
        # everywhere.
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sbcl

      - name: Install SBCL (macOS)
        if: runner.os == 'macOS'
        run: brew install sbcl

      - name: Install SBCL (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install sbcl --no-progress -y
          cygpath -w "/c/Program Files/Steel Bank Common Lisp" >> "$GITHUB_PATH"

      # IM's own runtime dependencies. The artifact carries libim and its
      # add-ons but not libtiff, libjpeg and friends, which every platform has
      # a package for. Windows is the exception: upstream builds it against
      # vcpkg, whose DLLs do not match anything choco or MSYS2 would install,
      # so the artifact has to carry them and there is nothing to install here.
      - name: Install IM runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends \
            libtiff6 libjpeg8 libpng16-16 zlib1g libexif12 \
            liblzf1 liblz4-1 libfftw3-double3 libfftw3-single3 libgomp1

      - name: Install IM runtime dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libtiff jpeg-turbo libpng libexif liblzf lz4 fftw libomp

      - name: Install and configure ocicl
        run: |
          # Clone the ocicl *tool* outside the repository, so it cannot collide
          # with this project's gitignored ocicl/ dependency directory.
          git clone --depth 1 https://github.com/ocicl/ocicl.git "$HOME/ocicl-src"
          ( cd "$HOME/ocicl-src" && sbcl --non-interactive --load setup.lisp )

          # setup.lisp installs the binary and the runtime to different places
          # on Windows than on Unix, so locate them rather than assume either.
          bin="$(find "$HOME" -type f \( -name ocicl -o -name ocicl.exe \) 2>/dev/null \
                   | grep -v '/ocicl-src/' | head -1)"
          runtime="$(find "$HOME" -type f -name ocicl-runtime.lisp 2>/dev/null \
                       | grep -v '/ocicl-src/' | head -1)"
          test -n "$bin"     || { echo "ocicl binary not found after setup"; exit 1; }
          test -n "$runtime" || { echo "ocicl runtime not found after setup"; exit 1; }

          dirname "$bin" >> "$GITHUB_PATH"
          if [ "$RUNNER_OS" = Windows ]; then runtime="$(cygpath -m "$runtime")"; fi
          echo "OCICL_RUNTIME=$runtime" >> "$GITHUB_ENV"

      - name: Restore dependencies
        run: |
          # ocicl install reports a per-system failure and still exits 0:
          #
          #   ; error downloading and installing ghcr.io/ocicl/cffi@sha256:...
          #   ; failed to install cffi from ghcr.io/ocicl/cffi@sha256:...
          #
          # That is not hypothetical. It turned this step green while cffi,
          # alexandria, fiveam, trivial-garbage and shasht were missing; the
          # build then died in ASDF with MISSING-DEPENDENCY on three of four
          # platforms, and because the publish job does not depend on the
          # builds, v0.7.1 went out as Latest carrying one binary out of four.
          #
          # ghcr.io fails per system, per runner, at random -- in one run the
          # platform that succeeded and the platforms that failed swapped
          # around -- so retry first, then fail loudly rather than leaving a
          # green step in front of a broken build.
          for attempt in 1 2 3; do
            ocicl setup
            ocicl install 2>&1 | tee ocicl-install.log || true
            if ! grep -qE "failed to install|error downloading and installing" ocicl-install.log; then
              ok=yes; break
            fi
            echo "::warning::ocicl reported install failures on attempt $attempt; retrying"
            sleep $((attempt * 10))
          done
          if [ "${ok:-no}" != yes ]; then
            echo "::error::ocicl could not install every dependency after 3 attempts"
            grep -E "failed to install|error downloading and installing" ocicl-install.log || true
            exit 1
          fi

          # Positive check: the above only catches what ocicl noticed. Ask ASDF
          # whether the systems the build actually needs resolve.
          tree="$PWD"
          if [ "$RUNNER_OS" = Windows ]; then tree="$(cygpath -m "$tree")"; fi
          sbcl --non-interactive --no-userinit --no-sysinit \
            --eval '(require :asdf)' \
            --eval "(asdf:initialize-source-registry '(:source-registry (:tree \"$tree\") :ignore-inherited-configuration))" \
            --eval '(handler-case
                        (progn (mapc (function asdf:find-system)
                                     (list "alexandria" "cffi" "fiveam" "trivial-garbage"
                                           "shasht" "clingon" "cl-ppcre"))
                               (format t "~&all direct dependencies resolve~%"))
                      (error (e)
                        (format *error-output* "~&::error::dependency does not resolve: ~A~%" e)
                        (uiop:quit 1)))'

      # The release archive is an installed tree -- lib/ and include/ -- while
      # the rest of this workflow expects the libraries flat in im-libs/, which
      # is the shape the CI artifact had. Flatten rather than teach every later
      # step about both layouts.
      # Two ways in, and they must not be confused.
      #
      # A repository_dispatch carries the run id per platform, so every
      # platform's libraries come from ONE upstream commit. That is the whole
      # reason the payload exists and it is what makes a red run here mean
      # "that commit broke us".
      #
      # A manual run has no payload. It takes the newest successful run of each
      # upstream workflow instead, exactly as release.yml does, which means the
      # four platforms can straddle commits if upstream pushed while this ran.
      # Good enough for "does upstream master still work", not good enough to
      # blame a specific commit.
      #
      # Previously this step used the payload unconditionally while the
      # workflow also advertised workflow_dispatch, so a manual run resolved
      # run_id to empty and every platform failed here before running anything.
      - name: Download IM libraries (from the dispatching run)
        if: github.event_name == 'repository_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: lispnik/tecgraf-im
          run_id: ${{ github.event.client_payload[matrix.run-id-key] }}
          name: ${{ matrix.im-artifact }}
          path: im-libs/

      - name: Download IM libraries (latest successful upstream run)
        if: github.event_name != 'repository_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: lispnik/tecgraf-im
          workflow: ${{ matrix.im-workflow }}
          branch: ${{ github.event.inputs.ref || 'master' }}
          name: ${{ matrix.im-artifact }}
          path: im-libs/

      # build/lib/ upstream holds more than libraries: the test binary, the
      # demo programs, the Lua modules, and on macOS an .app bundle. Keeping
      # them would not break anything, but the directory goes on the library
      # search path and is worth having contain only libraries.
      - name: Drop the non-libraries from the artifact
        run: |
          # build/lib/ upstream holds more than libraries: the test binary, the
          # demo programs, the Lua modules, and on macOS an .app bundle. This
          # directory goes on the library search path, so it should contain
          # libraries and nothing else.
          #
          # Filtered by FILE TYPE rather than by name, and that is the whole
          # point. An allowlist of libim* deleted IM's vcpkg dependencies on
          # Windows -- tiff.dll, jpeg62.dll, zlib1.dll -- which is the one
          # platform where they cannot be installed separately to match, and
          # im.dll then failed to load with a generic "Error opening shared
          # object", the file having been found but its dependencies not. A
          # denylist of known executables fixed that but fails OPEN: upstream
          # demonstrably grows programs here (document_enhance_v2 appeared
          # beside document_enhance), and the next one would be shipped and put
          # on the search path with nothing warning. Keeping only things that
          # are shared libraries fails closed and still keeps the vcpkg DLLs.
          #
          # imlua* are genuine shared libraries, so they survive the type test
          # and are named explicitly.
          find im-libs -mindepth 1 -maxdepth 1 \
            \( ! -name '*.so' ! -name '*.so.*' ! -name '*.dylib' ! -name '*.dll' \
               -o -name 'imlua*' \) \
            -exec rm -rf {} + || true
          echo "kept:"; ls -la im-libs/

      # Upstream builds macOS dylibs with absolute install names pointing at
      # ITS OWN build directory -- deliberately, because that makes them
      # dlopen-able from a runtime with no rpath, which is what CFFI wants.
      # Downloaded here, those paths do not exist, so libim_process's reference
      # to libim dangles. Rewrite each id and each inter-library reference to
      # where the files actually are.
      - name: Repair macOS install names
        if: runner.os == 'macOS'
        run: |
          cd im-libs
          # Read each reference with otool rather than assuming the path baked
          # in. It used to be hardcoded to upstream's build/lib, which was true
          # of the CI artifact and false of the release archive, where the
          # install prefix appears instead. Asking the library removes the
          # guess: whatever it names, if we have that file here, repoint it.
          for lib in libim*.dylib; do
            install_name_tool -id "$PWD/$lib" "$lib"
            otool -L "$lib" | awk 'NR>1 {print $1}' | while read -r dep; do
              case "$dep" in
                */libim*.dylib)
                  base="$(basename "$dep")"
                  [ -f "$base" ] \
                    && install_name_tool -change "$dep" "$PWD/$base" "$lib" 2>/dev/null || true ;;
              esac
            done
          done
          otool -L libim_process.dylib | head -5

      - name: Point the bindings at the libraries
        run: |
          libs="$PWD/im-libs"
          case "$RUNNER_OS" in
            Linux)   echo "LD_LIBRARY_PATH=$libs:$LD_LIBRARY_PATH"   >> "$GITHUB_ENV" ;;
            macOS)   echo "DYLD_LIBRARY_PATH=$libs:$DYLD_LIBRARY_PATH" >> "$GITHUB_ENV" ;;
            # Windows resolves dependent DLLs through PATH, and the IM DLLs
            # load each other, so the directory has to be on it.
            Windows) cygpath -w "$libs" >> "$GITHUB_PATH" ;;
          esac
          # SBCL on Windows is a native binary and cannot use Git Bash's
          # /d/a/... paths. cygpath -m gives a Windows path with forward
          # slashes, which SBCL accepts and which needs no escaping in a Lisp
          # string.
          if [ "$RUNNER_OS" = Windows ]; then libs="$(cygpath -m "$libs")"; fi
          echo "IM_LIBRARY_PATH=$libs" >> "$GITHUB_ENV"

          # Where ASDF should look for im.asd and the vendored ocicl/ tree.
          # Without this nothing finds the system at all: ASDF has no reason to
          # look in the checkout, and it only appeared to work locally because
          # a developer's ~/.sbclrc trees their projects directory. Same
          # incantation as the Makefile, so CI and `make' agree.
          tree="$PWD"
          if [ "$RUNNER_OS" = Windows ]; then tree="$(cygpath -m "$tree")"; fi
          echo "LISP_TREE=$tree" >> "$GITHUB_ENV"

      - name: Report what loaded
        run: |
          sbcl --non-interactive \
            --eval '(require :asdf)' \
            --eval "(asdf:initialize-source-registry '(:source-registry (:tree \"$LISP_TREE\") :ignore-inherited-configuration))" \
            --eval '(asdf:load-system :im)' \
            --eval '(progn
                      (format t "~%IM version: ~A (~A)~%" (im:version) (im:version-date))
                      (format t "Formats: ~{~A~^ ~}~%" (im:format-list))
                      (format t "FFTW3: ~A  Capture: ~A~%"
                              (im:fftw3-available-p) (im:capture-available-p))
                      (dolist (entry (im:loaded-libraries))
                        (format t "  ~A -> ~A~%" (car entry) (cdr entry))))'

      - name: Test
        run: |
          sbcl --non-interactive \
            --eval '(require :asdf)' \
            --eval "(asdf:initialize-source-registry '(:source-registry (:tree \"$LISP_TREE\") :ignore-inherited-configuration))" \
            --eval '(asdf:test-system :im)'

      # Builds bin/im, which is also what makes the CLI tests in the suite run
      # rather than skip -- they drive the binary as a subprocess, and that is
      # the only check that a dumped image reopens its foreign libraries.
      - name: Build the CLI
        run: |
          sbcl --non-interactive \
            --eval '(require :asdf)' \
            --eval "(asdf:initialize-source-registry '(:source-registry (:tree \"$LISP_TREE\") :ignore-inherited-configuration))" \
            --eval '(asdf:make :im/cli)'
          ls -la bin/

      - name: Smoke-test the binary
        run: |
          ./bin/im library
          ./bin/im info tests/images/lena.jpg --json
          ./bin/im process tests/images/lena.jpg /tmp/ci-out.png \
            --op resize=50% --op colorspace=gray --op sobel
          ./bin/im stats /tmp/ci-out.png

      - name: Re-run the suite with the binary present
        run: |
          sbcl --non-interactive \
            --eval '(require :asdf)' \
            --eval "(asdf:initialize-source-registry '(:source-registry (:tree \"$LISP_TREE\") :ignore-inherited-configuration))" \
            --eval '(asdf:test-system :im)'
